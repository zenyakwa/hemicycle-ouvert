# SECOURS UNIQUEMENT. La mise à jour normale tourne chaque nuit sur le serveur Scriptek
# (service updater/ déclenché par n8n), et le site est publié par Dokploy sur
# https://hemicycle.scriptek.eu à chaque modification du dépôt.
# Lancement manuel possible : onglet « Actions » → « Mise à jour (secours) » → « Run workflow ».
name: Mise à jour (secours)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  donnees:
    name: Télécharger les nouvelles données
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les données ouvertes de l'Assemblée
        run: python src/fetch.py
      - name: Reconstruire le site
        run: python src/prep.py
      - name: Enregistrer les changements
        run: |
          git config user.name "mise-a-jour-secours"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          if git diff --cached --quiet; then
            echo "Aucune nouveauté."
          else
            git commit -m "Mise à jour des données, secours GitHub ($(date -u +%Y-%m-%d))"
            git push
          fi
