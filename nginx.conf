# Hémicycle ouvert : site d'une seule page (index.html) avec de vraies adresses
# (/depute/<nom>, /scrutin/<n>, /votes/<thème>…) gérées par le navigateur.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Fichiers (avec extension) : servis tels quels, sinon vraie 404.
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Toute autre adresse affiche le site ; les données changent chaque nuit :
    # le navigateur revalide la page à chaque visite (ETag).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /cp.json {
        add_header Cache-Control "public, max-age=3600";
    }

    location ^~ /logos/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
